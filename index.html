<!-- Self-hosted VT323 (SIL OFL 1.1 license at /fonts/OFL.txt). Google Fonts removed 2026-05-19 — ZDR compliance: no third-party request on page load. -->
<style>
  @font-face {
    font-family: 'VT323';
    src: url('/fonts/VT323-Regular.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  :root{
    --mkb-white: #F5F5F0;
    --mkb-white-bright: #FFFFFF;
    --mkb-white-dim: #8A8A85;
    --phosphor: #007AA1;
    --phosphor-bright: #4DB8D4;
    --phosphor-dim: #004A61;
    --user-red: #FF3344;
    --option-blue: #4DB8FF;
    --bg: #000000;
    --shell-font: 'VT323', 'Courier New', monospace;
    --shell-font-size: clamp(260px, 34vw, 420px);
    --shell-line-height: 1.55;
    --shell-letter-spacing: 0.02em;
    --mkb-glow: rgba(245,245,240,0.35);
    --phosphor-glow: rgba(0,122,161,0.4);
    --red-glow: rgba(255,51,68,0.55);
    --blue-glow: rgba(77,184,255,0.5);
    --bright-glow: rgba(77,184,212,0.5);
    --scanline-opacity: 0.027;
    --vignette-color: 0,0,0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--mkb-white);overflow:hidden}
  body{
    font-family: var(--shell-font);
    font-size: var(--shell-font-size);
    line-height: var(--shell-line-height);
    letter-spacing: var(--shell-letter-spacing);
    text-shadow: 0 0 4px var(--mkb-glow);
    transition: background 0.6s ease, color 0.6s ease;
  }
  /* Archive shell: serif, no scanlines, warm paper vignette */
  body[data-shell="archive"]{
    font-weight: 400;
  }
  body[data-shell="archive"] .scanlines{opacity: 0.15}
  /* Bunker shell: clinical, hard edges */
  body[data-shell="bunker"] #output .ai{letter-spacing: 0.05em}

  #terminal{
    height: 100vh;
    width: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    padding: clamp(16px, 5vw, 60px);
    max-width: 1600px;
    margin: 0 auto;
    margin: 0 auto;
    scroll-behavior: smooth;
  }
  #terminal::-webkit-scrollbar{width:6px}
  #terminal::-webkit-scrollbar-track{background:transparent}
  #terminal::-webkit-scrollbar-thumb{background:rgba(0,122,161,0.15);border-radius:0}

  #output{
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 60vh;
  }
  #output .ai{color:var(--mkb-white);text-shadow:0 0 4px var(--mkb-glow);transition:color 0.6s ease, text-shadow 0.6s ease}
  #output .sys{color:var(--mkb-white-dim);font-size:0.85em;transition:color 0.6s ease}
  #output .system{color:var(--mkb-white);text-shadow:0 0 4px var(--mkb-glow);transition:color 0.6s ease, text-shadow 0.6s ease}
  #output .user{color:var(--phosphor);text-shadow:0 0 6px var(--phosphor-glow);transition:color 0.6s ease, text-shadow 0.6s ease}
  #output .hot{color:var(--phosphor);text-shadow:0 0 8px var(--phosphor-glow);transition:color 0.6s ease, text-shadow 0.6s ease}
  #output .bright{color:var(--phosphor-bright);text-shadow:0 0 10px var(--bright-glow);transition:color 0.6s ease, text-shadow 0.6s ease}
  #output .opt{color:var(--mkb-white);text-shadow:0 0 4px var(--mkb-glow);transition:color 0.6s ease, text-shadow 0.6s ease}
  #output .rule{color:var(--mkb-white-dim);letter-spacing:0;transition:color 0.6s ease}
  #output a{color:var(--option-blue);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;text-shadow:0 0 6px var(--blue-glow);transition:color 0.6s ease, text-shadow 0.6s ease}
  #output a:hover{background:var(--option-blue);color:#000;text-decoration:none}

  #input-line{
    display:flex;
    align-items:baseline;
    flex-wrap: nowrap;
    justify-content: flex-start;
    margin-top: 6px;
    margin-bottom: 40vh;
  }
  #input-line.hidden{display:none}
  #prompt-sign{
    color: var(--phosphor);
    text-shadow: 0 0 6px var(--phosphor-glow);
    margin-right: 8px;
    user-select:none;
    flex-shrink:0;
  }
  #user-input{
    background:transparent;
    border:none;
    outline:none;
    color: var(--phosphor);
    font-family: inherit;
    font-size: inherit;
    letter-spacing: inherit;
    line-height: inherit;
    caret-color: transparent;
    width: auto;
    field-sizing: content;
    padding:0;
    text-shadow: 0 0 6px var(--phosphor-glow);
  }
  #user-input::placeholder{color:var(--phosphor);opacity:0.85}

  .cursor{
    display:inline-block;
    width: 0.7em;
    height: 0.12em;
    background: var(--phosphor);
    box-shadow: 0 0 6px var(--phosphor-glow);
    vertical-align: baseline;
    margin-left: 3px;
    margin-bottom: 0.08em;
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink{50%{opacity:0}}
  #input-cursor{margin-left:0.5em}

  /* CRT MONITOR EFFECTS — old-school phosphor screen feel */

  /* Scanlines: thinner, slower rhythm, less aggressive */
  .scanlines{
    position:fixed;inset:0;pointer-events:none;z-index:100;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0, transparent 3px,
      rgba(0,0,0,var(--scanline-opacity)) 4px, transparent 5px
    );
    mix-blend-mode: multiply;
    transition: opacity 0.6s ease;
  }

  /* Rolling scan bar — slow bright horizontal bloom sweeping down */
  .scan-roll{
    position:fixed;left:0;right:0;height:120px;pointer-events:none;z-index:101;
    background: linear-gradient(
      to bottom,
      transparent 0%,
      rgba(0,122,161,0.009) 40%,
      rgba(0,122,161,0.021) 50%,
      rgba(0,122,161,0.009) 60%,
      transparent 100%
    );
    animation: scan-roll-sweep 9s linear infinite;
    mix-blend-mode: screen;
  }
  @keyframes scan-roll-sweep{
    0%   { transform: translateY(-120px); }
    100% { transform: translateY(100vh); }
  }

  /* CRT vignette — darker corners like old curved tube */
  .vignette{
    position:fixed;inset:0;pointer-events:none;z-index:99;
    background:
      radial-gradient(ellipse at center, transparent 30%, rgba(var(--vignette-color),0.145) 100%),
      radial-gradient(ellipse 140% 100% at 50% 50%, transparent 55%, rgba(0,0,0,0.085) 100%);
    transition: background 0.6s ease;
  }

  /* Phosphor haze — soft green glow bleeding from center */
  .phosphor-haze{
    position:fixed;inset:0;pointer-events:none;z-index:98;
    background: radial-gradient(ellipse at center, rgba(0,122,161,0.015) 0%, transparent 65%);
    transition: opacity 0.6s ease;
    animation: crt-flicker 0.15s steps(2) infinite;
  }

  /* CRT flicker — near-imperceptible opacity jitter */
  @keyframes crt-flicker{
    0%   { opacity: 1; }
    50%  { opacity: 0.96; }
    100% { opacity: 1; }
  }

  /* Chromatic aberration on terminal text — RGB split via layered text-shadow */
  /* ACTIVE text (currently typing) — sharp, no CRT distortion */
  #output .ai,
  #output .system{
    text-shadow: 0 0 4px var(--mkb-glow);
  }
  #output .hot,
  #output .opt{
    text-shadow: 0 0 8px var(--phosphor-glow);
  }
  #output .bright{
    text-shadow: 0 0 10px var(--bright-glow);
  }

  /* CRT effects removed */
  /* Input line — pure sharp, zero CRT */
  #prompt-sign,
  #user-input{
    text-shadow: none;
    filter: none;
  }

  /* Occasional screen blip — brief full-screen dim */
  .crt-blip{
    position:fixed;inset:0;pointer-events:none;z-index:102;
    background: rgba(0,0,0,0);
    mix-blend-mode: multiply;
  }
  .crt-blip.blip{ animation: blip-flash 0.18s ease-out; }
  @keyframes blip-flash{
    0%   { background: rgba(0,0,0,0); }
    40%  { background: rgba(0,0,0,0.35); }
    100% { background: rgba(0,0,0,0); }
  }

  body[data-shell="archive"] .phosphor-haze{opacity:0}
  body[data-shell="archive"] .scan-roll{display:none}
  body[data-shell="bunker"] .phosphor-haze{opacity:0.3}

  @media (prefers-reduced-motion: reduce){
    .cursor, #terminal { animation: none; scroll-behavior: auto; }
  }
  @media (max-width: 600px){
    body{font-size:17px}
    #terminal{padding:20px 16px 40px}
  }

  /* ============= EYE VIDEO + SCROLL SCRUBBING =============
     Video fills the screen. Scroll scrubs playback frame-by-frame.
     White flash fires when eye fully opens. Fade to black on PRESS ANY KEY.
     Future: swap eye.mp4 for Kling-edited version (white flash baked in). */
  #eye-sequence{
    position:fixed;inset:0;z-index:210;
    width:100%;height:100%;
    object-fit:cover;
    background:#000;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  #eye-sequence.active{
    opacity:1;
    visibility:visible;
    transition:opacity 0.3s ease;
  }
  /* White flash overlay — fires when eye fully opens */
  #eye-flash{
    position:fixed;inset:0;z-index:215;
    pointer-events:none;
    opacity:0;
  }
  #eye-flash.flash{
    animation: white-flash 0.7s ease-out forwards;
  }
  @keyframes white-flash{
    0%   { opacity:0; background:#fff }
    12%  { opacity:0.92 }
    100% { opacity:0 }
  }
  /* Phosphor-tinted alert flash — fires at NODE_DETECTED reveal moment.
     Shorter and dimmer than white-flash; matches CRT terminal palette.
     Cross-platform sensory parity with vibrate() on Android. */
  #eye-flash.alert-flash{
    animation: alert-flash 0.2s ease-out forwards;
  }
  @keyframes alert-flash{
    0%   { opacity:0; background:#4DB8D4 }
    30%  { opacity:0.5 }
    100% { opacity:0 }
  }
  /* Red variant — fires at the WARNING finale. Slightly longer + redder. */
  #eye-flash.alert-flash-red{
    animation: alert-flash-red 0.28s ease-out forwards;
  }
  @keyframes alert-flash-red{
    0%   { opacity:0; background:#FF3344 }
    30%  { opacity:0.55 }
    100% { opacity:0 }
  }
  /* WARNING line emphasis — oscillates between phosphor-bright and red
     three times after the typewriter completes the line. ~0.54s total. */
  .warning-flicker{
    animation: warning-flicker 0.18s ease-in-out 3;
  }
  @keyframes warning-flicker{
    0%, 100% {
      color: var(--phosphor-bright);
      text-shadow: 0 0 10px var(--bright-glow);
    }
    50% {
      color: var(--user-red);
      text-shadow: 0 0 16px var(--red-glow), 0 0 30px var(--red-glow);
    }
  }
  #start-overlay{
    position:fixed;inset:0;background:#000;z-index:220;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;
    transition: opacity 0.4s;
    gap: 14px;
  }
  #start-overlay.fade{opacity:0;pointer-events:none}
  #start-text{
    color: var(--phosphor);
    text-shadow: 0 0 12px var(--phosphor-glow);
    font-family: 'VT323', monospace;
    font-size: clamp(28px, 5vw, 48px);
    letter-spacing: 0.15em;
    line-height: 1.4;
    text-align: left;
    min-height: 4em;
    max-width: 90vw;
  }
  #start-text .landing-cursor{
    display: inline-block;
    width: 0.5em;
    height: 1em;
    background: var(--phosphor);
    box-shadow: 0 0 10px var(--phosphor);
    vertical-align: text-bottom;
    margin-left: 4px;
    animation: blink 1s steps(2) infinite;
  }
  #start-text.click-ready{
    cursor: pointer;
  }
  @keyframes fade-in-text{ to{ opacity:1 } }
  @keyframes fade-in{ to{ opacity:1 } }
  /* White Rabbit — hidden by default. ESC / R summons it at a random
     viewport position; multiple rapid presses teleport it around the
     screen, creating the "jumping rabbit / follow me" effect.
     Position (top, left) set inline by triggerRabbit() in JS. */
  #rabbit-overlay{
    position:fixed;
    z-index:180;
    pointer-events:none;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #rabbit-overlay.active{ opacity: 0.92 }
  /* Interaction timer — red counter top-right. Starts on first user
     gesture (click / keydown / touch / pointer) and counts up for the
     rest of the page life. Reminds the visitor that duration is data
     too — the page is watching how long they stayed.
     ZDR-clean: no external send, no log, no persistence beyond session. */
  #interaction-timer{
    position: fixed;
    top: clamp(8px, 1.5vw, 18px);
    right: clamp(12px, 2vw, 24px);
    z-index: 195;
    color: var(--user-red);
    text-shadow: 0 0 6px var(--red-glow);
    font-family: 'VT323', 'Courier New', monospace;
    font-size: clamp(14px, 1.8vw, 22px);
    letter-spacing: 0.1em;
    pointer-events: none;
    user-select: none;
    font-variant-numeric: tabular-nums;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #interaction-timer.active{ opacity: 0.85 }
  #rabbit-art{
    font-family: 'VT323', 'Courier New', monospace;
    font-size: clamp(10px, 1.4vw, 14px);
    color: #FFFFFF;
    text-shadow: 0 0 8px rgba(255,255,255,0.6), 0 0 18px rgba(0,122,161,0.3);
    white-space: pre;
    line-height: 1.0;
    letter-spacing: 0;
    opacity: 0.9;
    transform-origin: 50% 90%;
    will-change: transform;
  }
  /* Hop: one bounce cycle — slight squish-stretch + vertical leap */
  #rabbit-art.hop{
    animation: rabbit-hop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1) 1;
  }
  @keyframes rabbit-hop{
    0%   { transform: translateY(0) scaleY(1) scaleX(1); }
    20%  { transform: translateY(0) scaleY(0.85) scaleX(1.08); }  /* crouch */
    55%  { transform: translateY(-60px) scaleY(1.1) scaleX(0.92); } /* leap */
    80%  { transform: translateY(-10px) scaleY(1) scaleX(1); }    /* descend */
    95%  { transform: translateY(0) scaleY(0.92) scaleX(1.05); }  /* landing squish */
    100% { transform: translateY(0) scaleY(1) scaleX(1); }
  }
  #rabbit-caption{
    position:absolute;bottom:18%;
    font-family:'VT323', monospace;
    font-size: clamp(12px, 1.6vw, 16px);
    color: #FFFFFF;
    text-shadow: 0 0 6px rgba(255,255,255,0.5);
    letter-spacing: 0.25em;
    opacity: 0.7;
  }
  #terminal::-webkit-scrollbar { display: none; }
  #terminal { scrollbar-width: none; -ms-overflow-style: none; }
  /* Pill option colors */
  #output .pill-red { color: #FF3344; text-shadow: 0 0 8px rgba(255,51,68,0.8); }
  #output .pill-blue { color: #4DD2FF; text-shadow: 0 0 10px rgba(77,210,255,0.9); }
</style>

// Default shell — applied on page load. Gets swapped after picker answer.
let currentShell = SHELLS.matrix;

function applyShell(shellKey){
  const shell = SHELLS[shellKey];
  if(!shell) return;
  currentShell = shell;

  // Apply CSS custom properties
  const root = document.documentElement;
  Object.entries(shell.cssVars).forEach(([k, v]) => root.style.setProperty(k, v));

  // Mark body for shell-specific CSS selectors (scanline opacity, etc.)
  document.body.setAttribute('data-shell', shellKey);

  // Update prompt sign to reflect shell's signature
  const signEl = document.getElementById('prompt-sign');
  if(signEl) signEl.textContent = shell.promptSign;
}

// Speech helpers — pull shell-localised text + apply {var} substitution + shell prefix
function sp(key, vars){
  let s = (currentShell.speech && currentShell.speech[key]) || key;
  if(vars){
    Object.keys(vars).forEach(k => {
      s = s.split('{'+k+'}').join(vars[k]);
    });
  }
  return s;
}
function say(key, vars){ return currentShell.aiPrefix + sp(key, vars); }

// ========== MATRIX KEYSTROKE SOUND ==========
// Web Audio API — generates short mechanical clicks per character.
// Requires a user gesture to start (browser autoplay policy),
// so we initialise AudioContext on the first click/keypress.
let audioCtx = null;
let audioEnabled = false;

function initAudio(){
  if(audioCtx) return;
  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioEnabled = true;
  }catch(e){ /* Web Audio not supported — silent fallback */ }
}

// Keystroke sound — real click, not a tone.
// White-noise burst through a bandpass filter = mechanical tactile sound.
function keyClick(){
  if(!audioEnabled || !audioCtx) return;
  // ~35% of chars — sparse, organic
  if(Math.random() < 0.65) return;
  try{
    const now = audioCtx.currentTime;
    // 25ms white-noise buffer
    const duration = 0.025;
    const bufferSize = Math.floor(audioCtx.sampleRate * duration);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i = 0; i < bufferSize; i++){
      data[i] = (Math.random() * 2 - 1);
    }
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;

    // Bandpass around 2.5-3.3kHz — the "tk" consonant region of a real click
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 2400 + Math.random() * 900;
    filter.Q.value = 3.5;

    // Sharp attack (1ms), short body, quick decay
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.09, now + 0.001);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.022);

    src.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    src.start(now);
    src.stop(now + duration + 0.005);
  }catch(e){ /* noop */ }
}

// Cross-platform sensory trigger for the NODE_DETECTED reveal moment.
// Combines three signals so every platform gets at least two of them:
//   - Vibration: Android Chrome (~320ms patterned pulse). iOS Safari and
//     desktop don't expose navigator.vibrate, so this is a no-op there.
//   - Audio beep: any platform with audio enabled (descending two-tone
//     ~190ms square-wave alert). Requires user gesture for AudioContext,
//     which the prior CLICK TO CONTINUE already provided.
//   - Visual flash: any platform with the #eye-flash overlay (phosphor-
//     cyan flicker, 200ms). Works even with audio muted or muted device.
// All three fire in the same JS tick; the browser handles each
// independently. ZDR-clean: nothing sent externally, nothing recorded.
function triggerNodeDetectedAlert(){
  // 1. Android haptic
  try { navigator.vibrate?.([40, 60, 40, 60, 120]); } catch(e) { /* silent */ }

  // 2. Audio beep — two pulses (descending: 1100Hz → 740Hz) via square-wave
  //    oscillator. iOS Safari + desktop + Android all support this once the
  //    AudioContext is unsuspended (handled by armAudio() on first gesture).
  if(audioEnabled && audioCtx){
    try {
      const _now = audioCtx.currentTime;
      const pulse = (offset, freq, duration) => {
        const osc = audioCtx.createOscillator();
        osc.type = 'square';
        osc.frequency.value = freq;
        const g = audioCtx.createGain();
        const start = _now + offset;
        g.gain.setValueAtTime(0, start);
        g.gain.linearRampToValueAtTime(0.08, start + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + duration + 0.01);
      };
      pulse(0,    1100, 0.07);  // pulse 1: 70ms at 1100Hz
      pulse(0.10,  740, 0.09);  // pulse 2: 90ms at 740Hz, starting 100ms in
    } catch(e) { /* silent */ }
  }

  // 3. Visual flash — phosphor-cyan 200ms via CSS animation on #eye-flash.
  const flashEl = document.getElementById('eye-flash');
  if(flashEl){
    flashEl.classList.add('alert-flash');
    setTimeout(() => flashEl.classList.remove('alert-flash'), 250);
  }
}

// Cross-platform sensory trigger for the WARNING finale. Distinct from
// triggerNodeDetectedAlert() so the two reveal moments don't feel
// identical: heavier vibration, lower descending pitch (sawtooth, more
// alarm-like), red flash instead of cyan. Phase 1 closes with this.
function triggerWarningAlert(){
  // 1. Heavier Android haptic
  try { navigator.vibrate?.([120, 80, 220]); } catch(e) { /* silent */ }

  // 2. Audio — lower descending alarm via sawtooth (harsher than square)
  if(audioEnabled && audioCtx){
    try {
      const _now = audioCtx.currentTime;
      const pulse = (offset, freq, duration) => {
        const osc = audioCtx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.value = freq;
        const g = audioCtx.createGain();
        const start = _now + offset;
        g.gain.setValueAtTime(0, start);
        g.gain.linearRampToValueAtTime(0.10, start + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + duration + 0.01);
      };
      pulse(0,    480, 0.14);  // lower than NODE_DETECTED (was 1100Hz)
      pulse(0.16, 280, 0.18);  // descend even lower
    } catch(e) { /* silent */ }
  }

  // 3. Red flash overlay
  const flashEl = document.getElementById('eye-flash');
  if(flashEl){
    flashEl.classList.add('alert-flash-red');
    setTimeout(() => flashEl.classList.remove('alert-flash-red'), 320);
  }
}

};

// ========== INTERACTION TIMER ==========
// Red counter top-right (#interaction-timer). Starts on first user
// interaction; counts up HH:MM:SS for the rest of the page's life.
// Reminds the visitor that duration is data too — the page is watching
// how long they stayed. ZDR-clean: no external send, no log, no
// persistence beyond session.
let _interactionStart = null;
function startInteractionTimer(){
  if(_interactionStart !== null) return;
  _interactionStart = Date.now();
  const el = document.getElementById('interaction-timer');
  if(!el) return;
  el.classList.add('active');
  const tick = () => {
    const elapsed = Date.now() - _interactionStart;
    const t = Math.floor(elapsed / 1000);
    const h = String(Math.floor(t / 3600)).padStart(2, '0');
    const m = String(Math.floor(t / 60) % 60).padStart(2, '0');
    const s = String(t % 60).padStart(2, '0');
    el.textContent = `${h}:${m}:${s}`;
  };
  tick();
  setInterval(tick, 500);
}
['click','keydown','touchstart','pointerdown'].forEach(ev =>
  document.addEventListener(ev, startInteractionTimer, { once: true })
);

async function type(text, opts){
  // Clear any leftover trailing cursors from previous input commits
  output.querySelectorAll('.trail-cursor').forEach(el => el.remove());
  opts = opts || {};
  const cls = opts.cls || 'ai';
  const speed = opts.speed != null ? opts.speed : 18;
  const variance = opts.variance != null ? opts.variance : 8;
  const pauseAfter = opts.pauseAfter != null ? opts.pauseAfter : 200;
  const newline = opts.newline !== false;

  const span = document.createElement('span');
  span.className = cls;
  output.appendChild(span);

  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  output.appendChild(cursor);

  for(let i = 0; i < text.length; i++){
    if(skipTyping){
      span.textContent = text;
      break;
    }
    span.textContent += text[i];
    // Play keystroke sound for visible chars only (not spaces/newlines)
    if(text[i].trim()) keyClick();
    scrollBottom();
    const wait = Math.max(2, speed + (Math.random() * variance * 2 - variance));
    const extra = /[.!?]$/.test(text[i]) ? 140 : (/[,;:]$/.test(text[i]) ? 60 : 0);
    await sleep(wait + extra);
  }
  cursor.remove();
  // Mark span as done — CSS CRT chromatic aberration now activates
  span.classList.add('typed-done');
  if(newline) output.appendChild(document.createTextNode('\n'));
  scrollBottom();
  if(pauseAfter > 0) await sleep(skipTyping ? Math.min(pauseAfter, 50) : pauseAfter);
  return span;
}

async function ask(prompt, validator, opts){
  opts = opts || {};
  if(prompt) await type(prompt, { speed: 18, pauseAfter: 100 });

  return new Promise(resolve => {
    inputLine.classList.remove('hidden');
    inputEl.value = '';
    inputEl.placeholder = '';
    setTimeout(() => inputEl.focus(), 30);
    // Dynamically size input to its content so the cursor sits right after text.
    // +1ch buffer prevents the cursor block (visually a blinking _) from
    // overlapping the last glyph — VT323 at large size renders slightly wider
    // than CSS 'ch' (width-of-'0') estimates.
    const resizeInput = () => {
      const ch = Math.max((inputEl.value.length || inputEl.placeholder.length || 1), 1);
      inputEl.style.width = (ch + 1) + 'ch';
    };
    resizeInput();
    inputEl.addEventListener('input', resizeInput);
    // Watch placeholder changes via mutation observer
    const phObserver = new MutationObserver(resizeInput);
    phObserver.observe(inputEl, { attributes: true, attributeFilter: ['placeholder'] });

    // Animate placeholder character-by-character (matches intro typewriter rhythm)
    const _placeholder = opts.placeholder || '';
    if(_placeholder){
      (async () => {
        for(let i = 0; i < _placeholder.length; i++){
          inputEl.placeholder = _placeholder.slice(0, i+1);
          await new Promise(r => setTimeout(r, 55 + Math.random() * 35));
        }
      })();
    }

    // Optional live mirror — called on every keystroke with current value
    let onInputHandler = null;
    if(typeof opts.onChange === 'function'){
      onInputHandler = () => opts.onChange(inputEl.value);
      inputEl.addEventListener('input', onInputHandler);
    }

    function cleanup(){
      inputEl.removeEventListener('keydown', onKey);
      inputEl.removeEventListener('input', resizeInput);
      if(phObserver) phObserver.disconnect();
      if(onInputHandler) inputEl.removeEventListener('input', onInputHandler);
      if(onAnyInteraction){
        ['click','keydown','touchstart','pointerdown'].forEach(ev =>
          document.removeEventListener(ev, onAnyInteraction)
        );
      }
    }

    function commit(raw){
      const clean = validator ? validator(raw) : (raw || '').trim();
      if(clean === null){
        inputEl.value = '';
        inputEl.placeholder = '↑ nerozumiem, skús ešte raz';
        return;
      }
      if(!opts.silent){
        const echo = document.createElement('span');
        echo.className = 'user typed-done';
        const _en = new Date();
        const _ep = n => String(n).padStart(2,'0');
        const _ems = String(_en.getMilliseconds()).padStart(3,'0');
        const _estamp = _ep(_en.getHours())+':'+_ep(_en.getMinutes())+':'+_ep(_en.getSeconds())+'.'+_ems;
        const _eInputVal = String(raw).trim();
        const auditLine = _eInputVal
          ? '<USR:// '+_eInputVal+'>['+_estamp+']'
          : '<INTERACTION_CONFIRMED>['+_estamp+']';
        echo.textContent = auditLine;
        // Blinking _ stays at end of committed line
        const _echoCursor = document.createElement('span');
        _echoCursor.className = 'cursor';
        _echoCursor.setAttribute('aria-hidden','true');
        echo.appendChild(_echoCursor);
        output.appendChild(echo);
        output.appendChild(document.createTextNode('\n'));
      }
      scrollBottom();
      inputEl.value = '';
      inputLine.classList.add('hidden');
      cleanup();
      resolve(clean);
    }

    const onKey = (e) => {
      if(e.key === 'Enter'){
        e.preventDefault();
        commit(inputEl.value);
      }
    };
    inputEl.addEventListener('keydown', onKey);

    // If acceptClick: ANY recordable user gesture commits — click, keydown,
    // touchstart, pointerdown. Per design intent: "CLICK TO CONTINUE" is the
    // shorthand prompt, but any interaction we can detect should count.
    // Events targeted at inputEl are ignored — those still focus / type normally;
    // Enter inside the input is handled by the separate onKey listener above.
    let onAnyInteraction = null;
    if(opts.acceptClick){
      onAnyInteraction = (e) => {
        if(e.target === inputEl) return;
        commit(inputEl.value);
      };
      // Delay attach so the gesture that triggered this ask() doesn't instantly resolve
      setTimeout(() => {
        ['click','keydown','touchstart','pointerdown'].forEach(ev =>
          document.addEventListener(ev, onAnyInteraction)
        );
      }, 50);
    }
  });
}

  // Fires NOW — within the same tick as CLICK TO CONTINUE while browser
  // user-activation is fresh. Avoids Chrome's ~5s download-block window.
  // Single act of consent: the click that advanced past the prompt covers
  // both "continue the reveal" and "save the white rabbit's trail."
  // Filename + content are part of the narrative (Phase 1.5 design).
  // ZDR-clean: Blob generated locally, no fetch, no upload.
  const _fpContent = [
    '[USER-AUTHORED — TBD: opening in Mythos-Morpheus voice (docs/BRAND.md §Voice). NAME THE THRESHOLD: the visitor clicked on a domain called "0-click" — the click was already the first interaction; the page already had what is in this file by the moment of arrival. The page name is the thesis. One or two short lines. White-rabbit anchor permitted.]',
    '',

    '         0-click.com  ·  your browser, captured locally',
    '         ' + _now.toISOString(),
    '═══════════════════════════════════════════════════════════════════',
    '',
    '[USER-AUTHORED — TBD: framing in Mythos-Morpheus voice (docs/BRAND.md §Voice) — what this file is, magician\'s principle named openly, why the page wrote the trick back to the reader instead of just collecting. 3–5 sentences.]',
    '',
    '───────────────────────────────────────────────────────────────────',
    _SUBHDR,
    '───────────────────────────────────────────────────────────────────',
    '',
    ..._signals.flatMap(s => [
      `→ ${s.label.padEnd(14)} ${s.value}`,
      `  ${_inferences[s.label] || '[inference — TBD]'}`,
      '',
    ]),
    '───────────────────────────────────────────────────────────────────',
    '',
    '[USER-AUTHORED — TBD: closing in Mythos-Morpheus voice (docs/BRAND.md §Voice) — Zero Data Retention plainly stated, the white rabbit closes the narrative, what the reader can do with the file now. 3–5 sentences.]',
    '',
    'Source: https://0-click.com  ·  MIT  ·  qb-bp',
  ].join('\n');
  const _fpFilename = `follow-the-white-rabbit_${_date}.txt`;
  let _fpDownloaded = false;
  try {
    const _fpBlob = new Blob([_fpContent], { type: 'text/plain;charset=utf-8' });
    const _fpUrl = URL.createObjectURL(_fpBlob);
    const _fpA = document.createElement('a');
    _fpA.href = _fpUrl;
    _fpA.download = _fpFilename;
    document.body.appendChild(_fpA);
    _fpA.click();
    document.body.removeChild(_fpA);
    setTimeout(() => URL.revokeObjectURL(_fpUrl), 1000);
    _fpDownloaded = true;
  } catch(e) { /* silent — ZDR */ }

  // ── Shell typewriter — original audit-stamp format ──────────────
  // Two-surface design:
  //   - Shell (here) = THREAT MOMENT. Compact data dump, pipe-separated
  //     pairs, terminal aesthetic. The fact that the page already has
  //     these signals IS the PSYCHOLOGY effect — the visitor clicked
  //     0-click.com (literally "zero-click") and the page already knows.
  //     No commentary, no inference here. Fast (~4s), threatening.
  //   - .txt download (above, _fpContent) = EDUCATION LAYER. Narrative
  //     with magician's confession — what we made of each signal and
  //     what it does NOT prove. Mythos-Morpheus voice. Calm, deliberate.
  //   Same _signals values flow into both surfaces; presentation differs.
  const pad = (s, w) => String(s).padEnd(w);
  const LBL = 12;   // label column width
  const VAL_L = 30; // left-cell value column width
  const _cellTs  = pad('timestamp', LBL)    + pad(`${_date}  ${_time}.${_ms}`, VAL_L);
  const _cellTz  = pad('timezone', LBL)     + `${_tz} (UTC${_tzOff})`;
  const _cellLa  = _langClean ? (pad('language', LBL) + pad(_langClean, VAL_L)) : pad('', LBL+VAL_L);
  const _cellSc  = pad('screen', LBL)       + `${_scrW}×${_scrH} · dpr ${_dpr}x · ${_scrD}bit`;
  const _cellPl  = pad('platform', LBL)     + pad(_plat, VAL_L);
  const _cellUa  = _uaClean ? (pad('user-agent', LBL) + _uaClean) : '';
  const _cellCs  = pad('color-scheme', LBL) + pad(_cs, VAL_L);
  const _cellTp  = pad('touch-pts', LBL)    + pad(String(_tp), VAL_L);
  const _cellCk  = pad('cookies', LBL)      + pad(_ck, VAL_L);
  const _cellDnt = pad('dnt', LBL)          + pad(_dnt, VAL_L);

  const _row1 = _cellTs + '  │  ' + _cellTz;
  const _row2 = _cellLa + '  │  ' + _cellSc;
  const _row3 = _cellPl + '  │  ' + _cellUa;
  const _row4 = _cellCs + '  │  ' + _cellTp;
  const _row5 = _cellCk + '  │  ' + _cellDnt;

  const _hdrLine = '>> NODE_DETECTED';
  const _bodyLen = _row1.length;
  const _sepLine = '─'.repeat(_bodyLen);
  const _lines = [
    { text: _hdrLine, cls: 'bright typed-done' },
    { text: _sepLine, cls: 'sys typed-done' },
    { text: _row1,    cls: 'hot typed-done' },
    { text: _row2,    cls: 'hot typed-done' },
    { text: _row3,    cls: 'hot typed-done' },
    { text: _row4,    cls: 'hot typed-done' },
    { text: _row5,    cls: 'hot typed-done' },
  ];
  if (_connClean) _lines.push({ text: pad('network', LBL) + _connClean, cls: 'hot typed-done' });

  // Cross-platform sensory punctuation — fires the moment NODE_DETECTED begins.
  triggerNodeDetectedAlert();

  // Fast typewriter render — original ~4s pacing
  for (const item of _lines) {
    const sp = document.createElement('span');
    sp.className = item.cls;
    output.appendChild(sp);
    for (let i = 0; i < item.text.length; i++) {
      sp.textContent += item.text[i];
      if (item.text[i].trim()) keyClick();
      await sleep(5 + Math.random() * 4);
      scrollBottom();
    }
    output.appendChild(document.createTextNode('\n'));
    await sleep(60);
  }
  scrollBottom();
  await sleep(700);

  // ── Post-reveal confirmation — honest about uncertainty ──────────
  // The download attempt fired right after CLICK TO CONTINUE. On iOS
  // Safari the OS prompt may have asked the user to confirm; we cannot
  // know whether they accepted. Filename in the OS prompt acts as a
  // hint for the user even if overlay covers the reveal underneath.
  // Voice candidate for refinement: the bracketed CTA-style message.
  if (_fpDownloaded) {
    output.appendChild(document.createTextNode('\n'));
    const _dlConf = document.createElement('span');
    _dlConf.className = 'sys typed-done';
    _dlConf.textContent = `[ ${_fpFilename} — offered to your downloads ]`;
    output.appendChild(_dlConf);
    output.appendChild(document.createTextNode('\n'));
    scrollBottom();
    await sleep(900);
  }

  // ── "I can feel you now." ──────────────────────────────────────
  output.appendChild(document.createTextNode('\n'));
  await type('I can feel you now.', { cls: 'ai', speed: 90, variance: 22, pauseAfter: 2200 });
  output.appendChild(document.createTextNode('\n'));
  await sleep(300);

  // ── WARNING — Phase 1 finale punctuation ──────────────────────
  // Trigger red flash + low audio + heavy vibration AT THE START so the
  // visual / audio / haptic stage is set as the line begins to type.
  // Slow typewriter (40 vs original 22) gives weight. After the line
  // completes, attach .warning-flicker for 3 phosphor↔red glow cycles
  // (~0.54s). Long pause settles into Phase 1 silence — rabbit hidden,
  // timer ticking, WARNING glow lingering. The page comes to rest.
  triggerWarningAlert();
  const warningSpan = await type('WARNING: anomaly behaviour', { cls: 'bright', speed: 40, variance: 6, pauseAfter: 200 });
  if(warningSpan){
    warningSpan.classList.add('warning-flicker');
    setTimeout(() => warningSpan.classList.remove('warning-flicker'), 600);
  }
  await sleep(900);
  output.appendChild(document.createTextNode('\n'));
  await sleep(400);

  // ═══════════════════════════════════════════════════════════════
  //   PHASE 1 ENDS HERE.
  //
  //   The shell stops on the WARNING line above. The visitor is left
  //   with the page at rest — white rabbit persistent in the corner,
  //   interaction timer counting up in red, the reveal visible above.
  //
  //   Code below this return is preserved in source but gated off
  //   until Phase 2+ work (binary gamification, session journey,
  //   pill flow, reveal page) resumes the flow. See docs/TODO.md.
  // ═══════════════════════════════════════════════════════════════
  return;

  // "Program _0: loading" with progress bar 0→100%
  const progLabel = document.createElement('span');
  progLabel.className = 'bright typed-done';
  output.appendChild(progLabel);
  output.appendChild(document.createTextNode('\n'));
  scrollBottom();
  for(let pct = 0; pct <= 100; pct += 2){
    const filled = Math.floor(pct / 5);
    const bar = '█'.repeat(filled) + '░'.repeat(20 - filled);
    progLabel.textContent = `Program _0: loading  [${bar}]  ${String(pct).padStart(3)}%`;
    scrollBottom();
    await sleep(85 + Math.random() * 55);
  }
  await sleep(400);
  output.appendChild(document.createTextNode('\n'));

  // ── Matrix Binary Rain — Pure Shell aesthetic ─────────────────────────────
  // No motion blur, no fading tails. Raw data stream.
  // Phase 1 (6s): stable binary rain, 1s highlighted
  // Phase 2 (6s): probability 1→0 ramps up, speed slows
  // Phase 3: all dim 0s, falling very slowly
  // Finale: SYSTEM FAILURE in sharp blue box, hard blink on/off
  const rainOverlay = document.createElement('div');
  rainOverlay.style.cssText = [
    'position:fixed','inset:0','z-index:300','background:#000000',
    'overflow:hidden','font-family:"Courier New","Consolas",monospace'
  ].join(';');
  const canvas = document.createElement('canvas');
  const DPR = Math.max(1, window.devicePixelRatio || 1);
  canvas.width  = window.innerWidth  * DPR;
  canvas.height = window.innerHeight * DPR;
  canvas.style.cssText = 'display:block;width:100vw;height:100vh;image-rendering:pixelated';
  rainOverlay.appendChild(canvas);

  // No DOM box — SYSTEM ONLINE will be rendered as ASCII '1' art on canvas
  document.body.appendChild(rainOverlay);

  // SYSTEM ONLINE pixel-font bitmap — each '1' = drawn, '0' = empty (5×7 per letter)
  const PIXEL_FONT = {
    S: ['01111','10000','10000','01110','00001','00001','11110'],
    Y: ['10001','10001','10001','01010','00100','00100','00100'],
    T: ['11111','00100','00100','00100','00100','00100','00100'],
    E: ['11111','10000','10000','11110','10000','10000','11111'],
    M: ['10001','11011','10101','10001','10001','10001','10001'],
    O: ['01110','10001','10001','10001','10001','10001','01110'],
    N: ['10001','11001','10101','10011','10001','10001','10001'],
    L: ['10000','10000','10000','10000','10000','10000','11111'],
    I: ['01110','00100','00100','00100','00100','00100','01110']
  };
  const SYS_LINE1 = 'SYSTEM';
  const SYS_LINE2 = 'ONLINE';

  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;  // sharp pixel text
  ctx.scale(DPR, DPR);  // render at logical pixels, sharp on HiDPI

  // Typography — sharp monospace, no antialiasing artifacts
  const FONT_SIZE = 18;
  const FONT = `bold ${FONT_SIZE}px "Courier New", "Consolas", monospace`;
  ctx.font = FONT;
  // Measure actual char width for exact column alignment
  const charW = ctx.measureText('0').width;
  const COL_WIDTH_CHARS = 9;
  const GROUP_GAP_CHARS = 1;  // 1 space between 9-char groups
  const GROUP_W = charW * (COL_WIDTH_CHARS + GROUP_GAP_CHARS);
  const numGroups = Math.floor(window.innerWidth / GROUP_W);

  // One stream per character column inside every 9-char group
  // Stream = vertical falling pair (lead position + history of chars above)
  window._phase3Scrubbed = false;
  const streams = [];
  for(let g = 0; g < numGroups; g++){
    for(let k = 0; k < COL_WIDTH_CHARS; k++){
      streams.push({
        x: g * GROUP_W + k * charW,
        // Lead position in CHAR ROWS (not pixels) for pixel-perfect stepping
        row: -Math.floor(Math.random() * 40),
        // Trail length — how many chars above lead are visible
        trailLen: 12 + Math.floor(Math.random() * 24),
        // Rows per tick (step-based fall, not pixel motion blur)
        fallTicks: 1 + Math.floor(Math.random() * 3),
        tickCounter: 0,
        // Character history — newest (lead) at index 0
        history: Array.from({length: 48}, () => Math.random() > 0.5 ? '1' : '0')
      });
    }
  }

  const totalRows = Math.ceil(window.innerHeight / FONT_SIZE) + 2;

  const PHASE_1_END = 2000;    // 6s stable
  const PHASE_2_END = 5000;   // 6s corruption
  const PHASE_3_END = 9000;   // 2.5s only zeros falling slowly
  const FINALE_DURATION = 3000;  // SYSTEM ONLINE visible 3s

  const startTime = Date.now();
  let rainActive = true;
  let sysBoxVisible = false;
  let lastBlinkTime = 0;
  let blinkState = true;
  let finaleStartTime = null;

  function drawFrame(){
    // Hard clear — no ghost trails, pixel-perfect refresh
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    const elapsed = Date.now() - startTime;

    // Determine phase
    let phase;
    if(elapsed < PHASE_1_END) phase = 1;
    else if(elapsed < PHASE_2_END) phase = 2;
    else if(elapsed < PHASE_3_END) phase = 3;
    else phase = 4;  // finale

    // Phase 2: progress 0→1 of corruption
    const corruption = phase === 2
      ? (elapsed - PHASE_1_END) / (PHASE_2_END - PHASE_1_END)
      : (phase < 2 ? 0 : 1);

    // Speed multiplier — slows toward phase 3
    const speedMul = phase === 3 ? 0.3 : (phase === 2 ? 1 - corruption * 0.6 : 1);

    // One-shot: at the moment we ENTER phase 3, scrub all remaining 1s from history
    if(phase === 3 && !window._phase3Scrubbed){
      window._phase3Scrubbed = true;
      for(const s of streams){
        for(let i = 0; i < s.history.length; i++){
          s.history[i] = '0';
        }
      }
    }

    ctx.font = FONT;
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';

    if(rainActive){
      for(const s of streams){
        // Advance tick counter (integer steps, no fractional pixel motion)
        s.tickCounter++;
        const shouldFall = s.tickCounter >= Math.max(1, Math.round(s.fallTicks / speedMul));
        if(shouldFall){
          s.tickCounter = 0;
          s.row++;
          // Shift history down — new char at lead position (index 0)
          s.history.unshift(s.history[0]);  // duplicate, then randomize below
          if(s.history.length > 48) s.history.pop();
          // Generate new lead character based on phase
          if(phase === 1){
            // Balanced 0/1
            s.history[0] = Math.random() > 0.5 ? '1' : '0';
          } else if(phase === 2){
            // Probability of 1 decreases as corruption increases
            s.history[0] = Math.random() > (0.5 + corruption * 0.5) ? '1' : '0';
          } else {
            // Phase 3+ : only zeros
            s.history[0] = '0';
          }

          // Wrap around
          if(s.row - s.trailLen > totalRows + 5){
            s.row = -Math.floor(Math.random() * 20);
            s.trailLen = 12 + Math.floor(Math.random() * 24);
            s.fallTicks = 1 + Math.floor(Math.random() * 3);
          }
        }

        // Occasional flicker in existing trail — char flip mid-stream
        if(Math.random() < 0.06){
          const idx = 1 + Math.floor(Math.random() * Math.min(s.trailLen, s.history.length - 1));
          if(phase === 1){
            s.history[idx] = Math.random() > 0.5 ? '1' : '0';
          } else if(phase === 2){
            // Flicker 1s to 0s with corruption probability
            if(s.history[idx] === '1' && Math.random() < corruption){
              s.history[idx] = '0';
            } else {
              s.history[idx] = Math.random() > (0.5 + corruption * 0.5) ? '1' : '0';
            }
          } else {
            s.history[idx] = '0';
          }
        }

        // Draw the visible trail from lead (row) upward
        for(let t = 0; t < s.trailLen && t < s.history.length; t++){
          const rowPos = s.row - t;
          if(rowPos < 0 || rowPos > totalRows) continue;
          const y = rowPos * FONT_SIZE;
          const ch = s.history[t];

          if(ch === '1'){
            // 1 — brighter, subtle glow
            ctx.fillStyle = '#4DB8D4';
            ctx.shadowColor = '#007AA1';
            ctx.shadowBlur = 5;
          } else {
            // 0 — dim, flat, no shadow
            ctx.fillStyle = '#003A4D';
            ctx.shadowBlur = 0;
          }
          ctx.fillText(ch, s.x, y);
        }
        ctx.shadowBlur = 0;
      }
    } else {
      // Rain stopped but keep drawing last frame of zeros so bg not empty
      // (skipping — overlay stays black with SYSTEM FAILURE box)
    }

    // Phase 4: plain text SYSTEM ONLINE centered, blinking
    if(phase === 4){
      if(!sysBoxVisible){
        sysBoxVisible = true;
        rainActive = false;
        lastBlinkTime = Date.now();
        blinkState = true;

        // Create the SYSTEM ONLINE text element once
        if(!window._sysOnlineEl){
          const el = document.createElement('div');
          el.textContent = 'SYSTEM ONLINE';
          el.style.cssText = [
            'position:absolute','top:50%','left:50%',
            'transform:translate(-50%,-50%)',
            'color:#4DB8D4','font-family:"Courier New","Consolas",monospace',
            'font-size:clamp(64px,9vw,160px)','font-weight:bold',
            'letter-spacing:0.3em','text-shadow:0 0 12px #4DB8D4, 0 0 28px #007AA1',
            'pointer-events:none','z-index:2','user-select:none','white-space:nowrap'
          ].join(';');
          rainOverlay.appendChild(el);
          window._sysOnlineEl = el;
        }
      }

      // Black background — no rain, no noise
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

      // Blink on/off every 500ms
      const nowT = Date.now();
      if(nowT - lastBlinkTime > 500){
        lastBlinkTime = nowT;
        blinkState = !blinkState;
        if(window._sysOnlineEl){
          window._sysOnlineEl.style.visibility = blinkState ? 'visible' : 'hidden';
        }
      }
    }
  }

  // requestAnimationFrame loop
  let rafId;
  const animate = () => {
    drawFrame();
    rafId = requestAnimationFrame(animate);
  };
  animate();

  // Wait for full sequence: all phases + finale blink time
  await sleep(PHASE_3_END + FINALE_DURATION);

  cancelAnimationFrame(rafId);
  // Clear terminal FIRST (behind the black overlay), so nothing flashes
  output.innerHTML = '';
  await sleep(100);
  rainOverlay.remove();
  if(window._sysOnlineEl){ window._sysOnlineEl = null; }
  await sleep(200);

  // ── "At last." starts clean screen ───────────────────────────
  await type('At last.', { cls: 'ai', speed: 65, variance: 14, pauseAfter: 1000 });
  output.appendChild(document.createTextNode('\n'));
  await sleep(200);
}

// ========== WHITE RABBIT EASTER EGG ==========
// Matrix reference: Du Jour's white rabbit tattoo.
// Press ESC or R any time — rapid presses make the rabbit hop.
const RABBIT_ART = [
  "",
  "          (\\(\\ ",
  "          ( -.-) ",
  "         o_(\")(\") ",
  "",
  "       f o l l o w   m e",
  ""
].join("\n");

let rabbitHideTimer = null;
function triggerRabbit(){
  const overlay = document.getElementById('rabbit-overlay');
  const art = document.getElementById('rabbit-art');

  // Ensure the ASCII is present (first call only)
  if(!art.textContent) art.textContent = RABBIT_ART;

  // Teleport: pick a random viewport position. Multiple rapid ESC
  // presses make the rabbit "jump" around the screen — follow me.
  // Avoid the top-right interaction-timer zone so they don't collide.
  const margin = 24;
  const rabbitW = art.offsetWidth  || 220;
  const rabbitH = art.offsetHeight || 110;
  const vpW = window.innerWidth;
  const vpH = window.innerHeight;
  const maxLeft = Math.max(margin, vpW - rabbitW - margin);
  const maxTop  = Math.max(margin, vpH - rabbitH - margin);
  const timerExclusionTop   = 80;                       // timer's vertical zone
  const timerExclusionRight = 220;                      // timer's horizontal zone
  let rx, ry, tries = 0;
  do {
    rx = margin + Math.random() * (maxLeft - margin);
    ry = margin + Math.random() * (maxTop  - margin);
    tries++;
  } while (ry < timerExclusionTop && rx > vpW - timerExclusionRight - rabbitW && tries < 6);
  overlay.style.left = rx + 'px';
  overlay.style.top  = ry + 'px';

  // Cancel any pending hide — user is actively summoning the rabbit
  if(rabbitHideTimer){
    clearTimeout(rabbitHideTimer);
    rabbitHideTimer = null;
  }

  // Reveal overlay (idempotent at given position)
  overlay.classList.add('active');

  // Re-trigger hop animation: remove class, force reflow, add class back.
  // Without this, repeated ESC presses within a single animation wouldn't re-hop.
  art.classList.remove('hop');
  void art.offsetWidth; // force reflow — CSS animation restart idiom
  art.classList.add('hop');

  // Schedule fade-out 2.5s after last press
  rabbitHideTimer = setTimeout(() => {
    overlay.classList.remove('active');
    rabbitHideTimer = null;
  }, 2500);
}

document.addEventListener('keydown', (e) => {
  // Only block before scenario starts (start-overlay visible).
  // Within the scenario the rabbit follows everywhere — including while
  // the input is focused. User's intent: ESC effect throughout.
  if(document.body.contains(startOverlay)) return;

  // ESC = primary trigger. Also R for keyboard-only users who don't know ESC trick.
  if(e.key === 'Escape' || e.key === 'r' || e.key === 'R'){
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    e.preventDefault();
    triggerRabbit();
  }
});

const eyeVideo = document.getElementById('eye-sequence');
const eyeFlash = document.getElementById('eye-flash');

// Preload video so it's ready when needed

// White flash fires at ~37% (3s of 8s) — matches video's overexposure moment
function setupVideoFlash(){
  eyeVideo.addEventListener('timeupdate', () => {
    if(!eyeVideo.duration) return;
    const pct = eyeVideo.currentTime / eyeVideo.duration;
    if(pct > 0.35 && pct < 0.44 && !eyeFlash.classList.contains('flash')){
      eyeFlash.classList.add('flash');
      setTimeout(() => eyeFlash.classList.remove('flash'), 900);
    }
  });
}

// Scroll-to-portal: called after red pill confirm.
// Phase 1: scroll darkens screen to black (overlay 0→1).
// Phase 2: at full black, video plays; scroll now scrubs it fast.
// Phase 3: video plays to white flash; then overlay fades + terminal continues.
async function scrollToVideoPortal(){
  return new Promise(resolve => {
    // Red pill = scroll DOWN (deltaY > 0) — just blackout, no video. Dig deeper into code.
    // Blue pill = scroll UP (deltaY < 0) — blackout then eye video. Wake up.
    const expectDown = (state.pill === 'red');
    const showVideo  = (state.pill === 'blue');

    const blackout = document.createElement('div');
    blackout.style.cssText = [
      'position:fixed','inset:0','background:#000','opacity:0',
      'z-index:208','pointer-events:none'
    ].join(';');
    document.body.appendChild(blackout);

    let scrollAccum = 0;
    const DARKEN_SCROLL = 500;
    const SCRUB_SPEED   = 0.15;
    let phase = 'darken';

    function onWheel(e){
      e.preventDefault();

      if(phase === 'darken'){
        const relevantDelta = expectDown ? e.deltaY : -e.deltaY;
        if(relevantDelta <= 0) return;

        scrollAccum = Math.max(0, Math.min(DARKEN_SCROLL, scrollAccum + relevantDelta));
        blackout.style.opacity = scrollAccum / DARKEN_SCROLL;

        if(scrollAccum >= DARKEN_SCROLL){
          phase = 'done';

          if(!showVideo){
            // RED pill — just fade blackout and continue (terminal continues on black)
            window.removeEventListener('wheel', onWheel);
            setTimeout(() => {
              blackout.style.transition = 'opacity 0.8s ease';
              blackout.style.opacity = '0';
              setTimeout(() => { blackout.remove(); resolve(); }, 850);
            }, 400);
            return;
          }

          // BLUE pill — eye video portal
          phase = 'video';
          eyeVideo.currentTime = 0;
          eyeVideo.classList.add('active');
          blackout.style.transition = 'opacity 0.4s ease';
          blackout.style.opacity = '0';
          eyeVideo.play().catch(() => {});

          const onFlash = () => {
            window.removeEventListener('wheel', onWheel);
            setTimeout(() => {
              eyeVideo.style.transition = 'opacity 0.8s ease';
              eyeVideo.style.opacity = '0';
              blackout.style.opacity = '0';
              setTimeout(() => {
                eyeVideo.classList.remove('active');
                eyeVideo.style.opacity = '';
                eyeVideo.style.transition = '';
                eyeVideo.pause();
                blackout.remove();
                resolve();
              }, 900);
            }, 300);
            eyeVideo.removeEventListener('timeupdate', flashWatcher);
          };
          const flashWatcher = () => {
            if(!eyeVideo.duration) return;
            const pct = eyeVideo.currentTime / eyeVideo.duration;
            if(pct > 0.44){ onFlash(); }
          };
          eyeVideo.addEventListener('timeupdate', flashWatcher);
        }

      } else if(phase === 'video'){
        const delta = (e.deltaY / 100) * SCRUB_SPEED;
        eyeVideo.currentTime = Math.max(0,
          Math.min(eyeVideo.duration || 8, eyeVideo.currentTime + delta));
      }
    }

    window.addEventListener('wheel', onWheel, { passive: false });
  });
}
